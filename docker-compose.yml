version: '3.8'

services:
  # Flask 웹 애플리케이션
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-journal-web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://journal_user:journal_pass@db:5432/journal_db
      - REDIS_URL=redis://cache:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-random-secret-key}
    volumes:
      - ./logs:/app/logs
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - journal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    container_name: flask-journal-db
    environment:
      - POSTGRES_DB=journal_db
      - POSTGRES_USER=journal_user
      - POSTGRES_PASSWORD=journal_pass
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - journal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal_user -d journal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 캐시
  cache:
    image: redis:7-alpine
    container_name: flask-journal-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - journal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Nginx 리버스 프록시 (선택사항)
  nginx:
    image: nginx:alpine
    container_name: flask-journal-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_files:/app/static:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - journal-network

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads:
    driver: local
  static_files:
    driver: local

# Custom network
networks:
  journal-network:
    driver: bridge
