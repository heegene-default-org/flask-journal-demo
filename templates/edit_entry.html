{% extends "base.html" %}

{% block title %}{{ _('Edit Entry') }} - {{ _('Journal Demo') }}{% endblock %}

{% block content %}
<div class="form-container">
    <h2>{{ _('Edit Journal Entry') }}</h2>
    
    <form method="POST" class="entry-form">
        <div class="form-group">
            <label for="title">{{ _('Title') }}:</label>
            <input type="text" id="title" name="title" value="{{ entry.title }}" required>
        </div>
        
        <div class="form-group">
            <label for="content">{{ _('Content') }}:</label>
            <textarea id="content" name="content" rows="10" required>{{ entry.content }}</textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ _('Update Entry') }}</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">{{ _('Cancel') }}</a>
        </div>
    </form>
</div>
{% endblock %}
